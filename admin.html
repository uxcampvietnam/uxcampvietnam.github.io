<!DOCTYPE html>
<html lang="vi">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Chuyển hướng đến Admin Portal — UXCamp Vietnam</title>
	<link rel="icon" href="asset/icon/favicon.ico">
	<meta http-equiv="refresh" content="0; url=admin/index.html">
	<style>
		body {
			background: #0b0d13;
			color: #f8fafc;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			display: flex;
			align-items: center;
			justify-content: center;
			height: 100vh;
			margin: 0;
			text-align: center;
		}

		.redirect-box {
			background: #131722;
			border: 1px solid rgba(255, 255, 255, 0.1);
			padding: 32px 40px;
			border-radius: 12px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
		}

		.spinner {
			width: 32px;
			height: 32px;
			border: 3px solid rgba(255, 255, 255, 0.15);
			border-top-color: #6366f1;
			border-radius: 50%;
			animation: spin 0.8s linear infinite;
			margin: 0 auto 16px;
		}

		@keyframes spin {
			to {
				transform: rotate(360deg);
			}
		}

		a {
			color: #6366f1;
			text-decoration: none;
			font-weight: 500;
		}

		a:hover {
			text-decoration: underline;
		}
	</style>
</head>

<body>
	<div class="redirect-box">
		<div class="spinner"></div>
		<h2 style="font-size: 18px; margin-bottom: 8px;">Đang chuyển hướng đến Admin Portal mới...</h2>
		<p style="font-size: 13px; color: #94a3b8; margin-bottom: 16px;">Hệ thống Admin đã được nâng cấp sang kiến trúc đa trang theo từng module.</p>
		<a href="admin/index.html">Nhấp vào đây nếu trang không tự chuyển hướng →</a>
	</div>
	<script>
		window.location.replace('admin/index.html');
	</script>
</body>

</html>
