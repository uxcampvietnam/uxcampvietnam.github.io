<!DOCTYPE html>
<html lang="vi">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Thêm Case Study Mới — UXCamp Admin</title>
	<link rel="icon" href="../../../asset/icon/favicon.ico">
	<meta name="robots" content="noindex, nofollow">

	<!-- Bootstrap 5 -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- Custom CSS -->
	<link rel="stylesheet" type="text/css" href="../../../style/definition.css">
	<link rel="stylesheet" type="text/css" href="../../../style/style.css">
	<link rel="stylesheet" type="text/css" href="../../../style/admin.css">
	<link rel="stylesheet" type="text/css" href="../../admin-shared.css">

	<!-- Firebase SDK -->
	<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>

<body>

	<div class="app-container admin-app-container">

		<!-- Auth gate overlay -->
		<div class="auth-gate" id="auth-gate">
			<div class="auth-spinner"></div>
			<span class="font-sans-caption" style="color: var(--main-colors-foreground-f700);">Đang kiểm tra quyền truy cập admin...</span>
		</div>

		<!-- SIDEBAR PANEL (Rendered dynamically by admin-shell.js) -->
		<aside class="sidebar admin-sidebar" id="sidebar" style="display: none;"></aside>

		<!-- MAIN CONTENT WORKSPACE -->
		<div class="main-wrapper admin-main-wrapper" id="admin-content" style="display: none;">
			<main class="main-content admin-main-content">

				<!-- Top Bar -->
				<header class="admin-top-bar">
					<div class="top-bar-left">
						<button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Mở menu quản lý">
							<svg style="width:20px;height:20px;fill:currentColor" viewBox="0 0 24 24">
								<path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
							</svg>
						</button>
						<div>
							<div class="admin-breadcrumb">
								<a href="../../index.html">Admin</a>
								<span class="separator">/</span>
								<a href="index.html">Case Studies</a>
								<span class="separator">/</span>
								<span>Thêm mới</span>
							</div>
							<h4 class="font-sans-h4 medium m-0" style="color: var(--main-colors-foreground-f100);">Thêm Case Study Mới</h4>
						</div>
					</div>
					<div class="top-bar-actions">
						<a href="index.html" class="btn-admin btn-admin-secondary btn-admin-sm">← Quay lại danh sách</a>
					</div>
				</header>

				<!-- FORM CARD (Full horizontal width) -->
				<div class="admin-card">
					<div class="admin-card-header">
						<h5 class="font-sans-h5 medium m-0" style="color: var(--main-colors-foreground-f200);">Thông Tin Đồ Án / Case Study</h5>
						<span class="font-sans-small" style="color: var(--main-colors-foreground-f700);">Khai báo dự án thực chiến của học viên</span>
					</div>

					<form id="create-case-form">
						<div class="form-grid-2">
							<div class="form-group">
								<label for="case-title">Tiêu đề Dự án / Case Study <span class="required">*</span></label>
								<input type="text" id="case-title" class="form-control-custom" placeholder="VD: Redesign Trải Nghiệm Mua Sắm E-Commerce" required>
							</div>
							<div class="form-group">
								<label for="case-author">Tác giả / Nhóm học viên <span class="required">*</span></label>
								<input type="text" id="case-author" class="form-control-custom" placeholder="VD: Nguyễn Văn A (UXCamp Bootcamp K08)" required>
							</div>
						</div>

						<div class="form-grid-2">
							<div class="form-group">
								<label for="case-thumbnail">Ảnh Thu Nhỏ (Thumbnail URL)</label>
								<input type="url" id="case-thumbnail" class="form-control-custom" placeholder="https://... ảnh tỉ lệ 16:9 hoặc 4:3">
							</div>
							<div class="form-group">
								<label for="case-published">Trạng thái xuất bản</label>
								<select id="case-published" class="form-control-custom" required>
									<option value="true" selected>Công khai (Published)</option>
									<option value="false">Bản nháp (Draft)</option>
								</select>
							</div>
						</div>

						<div class="form-grid-2">
							<div class="form-group">
								<label for="case-figma">Link Figma Prototype / File</label>
								<input type="url" id="case-figma" class="form-control-custom" placeholder="https://www.figma.com/proto/...">
							</div>
							<div class="form-group">
								<label for="case-presentation">Link Slide Thuyết Trình / Báo cáo</label>
								<input type="url" id="case-presentation" class="form-control-custom" placeholder="https://docs.google.com/presentation/...">
							</div>
						</div>

						<div class="form-group">
							<label for="case-summary">Tóm tắt bối cảnh & giải pháp (Executive Summary)</label>
							<textarea id="case-summary" class="form-control-custom" rows="3" placeholder="Tóm lược vấn đề cốt lõi của người dùng, phương pháp nghiên cứu và giải pháp thiết kế đạt được..."></textarea>
						</div>

						<div class="form-group">
							<label for="case-content">Nội dung chi tiết (Markdown hoặc HTML)</label>
							<textarea id="case-content" class="form-control-custom" rows="8" placeholder="Nhập nội dung chi tiết case study..."></textarea>
						</div>

						<div class="d-flex justify-content-end gap-3 mt-4 pt-3" style="border-top: 0.5px solid var(--transparent-foreground-main-color-10);">
							<a href="index.html" class="btn-admin btn-admin-secondary">Hủy Bỏ</a>
							<button type="submit" class="btn-admin btn-admin-primary" id="btn-save-case">💾 Lưu Bài Viết Case Study</button>
						</div>
					</form>
				</div>

			</main>
		</div>

	</div>

	<script src="casestudy-create.js"></script>
	<script src="../../admin-shell.js"></script>

</body>

</html>
