<!DOCTYPE html>
<html lang="vi">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Quản lý Case Studies — UXCamp Admin</title>
	<link rel="icon" href="../../../asset/icon/favicon.ico">
	<meta name="robots" content="noindex, nofollow">

	<!-- Bootstrap 5 -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- Custom CSS -->
	<link rel="stylesheet" type="text/css" href="../../../style/definition.css">
	<link rel="stylesheet" type="text/css" href="../../../style/style.css">
	<link rel="stylesheet" type="text/css" href="../../../style/admin.css">
	<link rel="stylesheet" type="text/css" href="../../admin-shared.css">

	<!-- Firebase SDK -->
	<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>

<body>

	<div class="app-container admin-app-container">

		<!-- Auth gate overlay -->
		<div class="auth-gate" id="auth-gate">
			<div class="auth-spinner"></div>
			<span class="font-sans-caption" style="color: var(--main-colors-foreground-f700);">Đang kiểm tra quyền truy cập admin...</span>
		</div>

		<!-- SIDEBAR PANEL (Rendered dynamically by admin-shell.js) -->
		<aside class="sidebar admin-sidebar" id="sidebar" style="display: none;"></aside>

		<!-- MAIN CONTENT WORKSPACE -->
		<div class="main-wrapper admin-main-wrapper" id="admin-content" style="display: none;">
			<main class="main-content admin-main-content">

				<!-- Top Bar -->
				<header class="admin-top-bar">
					<div class="top-bar-left">
						<button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Mở menu quản lý">
							<svg style="width:20px;height:20px;fill:currentColor" viewBox="0 0 24 24">
								<path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
							</svg>
						</button>
						<div>
							<div class="admin-breadcrumb">
								<a href="../../index.html">Admin</a>
								<span class="separator">/</span>
								<a href="index.html">CMS</a>
								<span class="separator">/</span>
								<span>Case Studies</span>
							</div>
							<h4 class="font-sans-h4 medium m-0" style="color: var(--main-colors-foreground-f100);">Quản Lý Case Studies Học Viên</h4>
						</div>
					</div>
					<div class="top-bar-actions">
						<button type="button" class="btn-admin btn-admin-secondary btn-admin-sm" id="btn-export-cases">Export JSON</button>
						<a href="create.html" class="btn-admin btn-admin-primary btn-admin-sm">+ Thêm Case Study Mới</a>
					</div>
				</header>

				<!-- CASE STUDIES TABLE CARD -->
				<section class="admin-card">
					<div class="admin-card-header flex-wrap gap-2">
						<div>
							<h5 class="font-sans-h5 medium m-0" style="color: var(--main-colors-foreground-f200);">Danh Sách Đồ Án & Case Studies</h5>
							<span class="font-sans-small" style="color: var(--main-colors-foreground-f700);">Các dự án tốt nghiệp thực chiến trưng bày trên website</span>
						</div>
						<div class="d-flex gap-2 align-items-center flex-wrap">
							<input type="text" id="search-cases" class="form-control-custom" placeholder="Tìm theo tiêu đề, tác giả..." style="width: 260px; height: 36px; font-size: 12px;">
						</div>
					</div>

					<div class="user-table-container" id="cases-list-container">
						<div class="empty-state p-4 text-center">
							<div class="auth-spinner"></div>
							<span class="font-sans-caption mt-2">Đang tải case studies...</span>
						</div>
					</div>
				</section>

			</main>
		</div>

	</div>

	<script src="casestudy-index.js"></script>
	<script src="../../admin-shell.js"></script>

</body>

</html>
