<!DOCTYPE html>
<html lang="vi">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Cấp Chứng Chỉ Mới — UXCamp Admin</title>
	<link rel="icon" href="../../../asset/icon/favicon.ico">
	<meta name="robots" content="noindex, nofollow">

	<!-- Bootstrap 5 -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- Custom CSS -->
	<link rel="stylesheet" type="text/css" href="../../../style/definition.css">
	<link rel="stylesheet" type="text/css" href="../../../style/style.css">
	<link rel="stylesheet" type="text/css" href="../../../style/admin.css">
	<link rel="stylesheet" type="text/css" href="../../admin-shared.css">

	<!-- Firebase SDK -->
	<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>

<body>

	<div class="app-container admin-app-container">

		<!-- Auth gate overlay -->
		<div class="auth-gate" id="auth-gate">
			<div class="auth-spinner"></div>
			<span class="font-sans-caption" style="color: var(--main-colors-foreground-f700);">Đang kiểm tra quyền truy cập admin...</span>
		</div>

		<!-- SIDEBAR PANEL (Rendered dynamically by admin-shell.js) -->
		<aside class="sidebar admin-sidebar" id="sidebar" style="display: none;"></aside>

		<!-- MAIN CONTENT WORKSPACE -->
		<div class="main-wrapper admin-main-wrapper" id="admin-content" style="display: none;">
			<main class="main-content admin-main-content">

				<!-- Top Bar -->
				<header class="admin-top-bar">
					<div class="top-bar-left">
						<button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Mở menu quản lý">
							<svg style="width:20px;height:20px;fill:currentColor" viewBox="0 0 24 24">
								<path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
							</svg>
						</button>
						<div>
							<div class="admin-breadcrumb">
								<a href="../../index.html">Admin</a>
								<span class="separator">/</span>
								<a href="index.html">Certificates</a>
								<span class="separator">/</span>
								<span>Cấp mới</span>
							</div>
							<h4 class="font-sans-h4 medium m-0" style="color: var(--main-colors-foreground-f100);">Cấp Chứng Chỉ Tốt Nghiệp Mới</h4>
						</div>
					</div>
					<div class="top-bar-actions">
						<a href="index.html" class="btn-admin btn-admin-secondary btn-admin-sm">← Quay lại danh sách</a>
					</div>
				</header>

				<!-- FORM CARD (Full horizontal width) -->
				<div class="admin-card">
					<div class="admin-card-header">
						<h5 class="font-sans-h5 medium m-0" style="color: var(--main-colors-foreground-f200);">Thông Tin Chứng Chỉ Xác Thực</h5>
						<span class="font-sans-small" style="color: var(--main-colors-foreground-f700);">Hệ thống tự động phát hành mã UUID v4 bảo toàn liên kết tra cứu</span>
					</div>

					<form id="create-cert-form">
						<div class="form-grid-2">
							<div class="form-group">
								<label for="cert-student-name">Họ và Tên Học Viên <span class="required">*</span></label>
								<input type="text" id="cert-student-name" class="form-control-custom" placeholder="VD: Trần Hoàng Nam" required>
							</div>
							<div class="form-group">
								<label for="cert-student-email">Email Học Viên <span class="required">*</span></label>
								<input type="email" id="cert-student-email" class="form-control-custom" placeholder="student@gmail.com" required>
							</div>
						</div>

						<div class="form-grid-2">
							<div class="form-group">
								<label for="cert-course">Khóa Học Tốt Nghiệp <span class="required">*</span></label>
								<select id="cert-course" class="form-control-custom" required>
									<option value="">-- Chọn Khóa Học --</option>
								</select>
							</div>
							<div class="form-group">
								<label for="cert-cohort">Lớp Học / Đợt Tuyển Sinh</label>
								<select id="cert-cohort" class="form-control-custom">
									<option value="">-- Không chọn / Tự do --</option>
								</select>
							</div>
						</div>

						<div class="form-grid-2">
							<div class="form-group">
								<label for="cert-date">Ngày Cấp Chứng Chỉ <span class="required">*</span></label>
								<input type="date" id="cert-date" class="form-control-custom" required>
							</div>
							<div class="form-group">
								<label for="cert-uuid">Mã UUID Định Danh Duy Nhất (Tự Sinh)</label>
								<div class="d-flex gap-2">
									<input type="text" id="cert-uuid" class="form-control-custom" readonly style="font-family: monospace; opacity: 0.8;">
									<button type="button" class="btn-admin btn-admin-secondary btn-admin-sm" id="btn-regen-uuid" title="Tạo lại UUID khác">🔄</button>
								</div>
							</div>
						</div>

						<div class="form-group">
							<label for="cert-project">Đồ Án Tốt Nghiệp / Final Project Name</label>
							<input type="text" id="cert-project" class="form-control-custom" placeholder="VD: Redesign Trải Nghiệm Ứng Dụng Ngân Hàng Số SmartBanking">
						</div>

						<div class="p-3 rounded-3 mb-3" style="background: var(--body-background-elevate-2); border: 0.5px solid var(--console-stroke);">
							<span class="font-sans-small fw-semibold" style="color: var(--alternative-foreground-gold);">🔗 Link xác thực chứng chỉ công khai:</span>
							<div class="font-sans-caption mt-1" id="cert-preview-link" style="color: var(--main-colors-foreground-f300); word-break: break-all; font-family: monospace; font-size: 11.5px;">—</div>
						</div>

						<div class="d-flex justify-content-end gap-3 mt-4 pt-3" style="border-top: 0.5px solid var(--transparent-foreground-main-color-10);">
							<a href="index.html" class="btn-admin btn-admin-secondary">Hủy Bỏ</a>
							<button type="submit" class="btn-admin btn-admin-primary" id="btn-save-cert">🎓 Phát Hành Chứng Chỉ</button>
						</div>
					</form>
				</div>

			</main>
		</div>

	</div>

	<script src="certificate-create.js"></script>
	<script src="../../admin-shell.js"></script>

</body>

</html>
