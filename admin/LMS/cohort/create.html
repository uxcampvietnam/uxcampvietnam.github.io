<!DOCTYPE html>
<html lang="vi">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Mở Lớp Học Mới — UXCamp Admin</title>
	<link rel="icon" href="../../../asset/icon/favicon.ico">
	<meta name="robots" content="noindex, nofollow">

	<!-- Bootstrap 5 -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- Custom CSS -->
	<link rel="stylesheet" type="text/css" href="../../../style/definition.css">
	<link rel="stylesheet" type="text/css" href="../../../style/style.css">
	<link rel="stylesheet" type="text/css" href="../../../style/admin.css">
	<link rel="stylesheet" type="text/css" href="../../admin-shared.css">

	<!-- Firebase SDK -->
	<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>

<body>

	<div class="app-container admin-app-container">

		<!-- Auth gate overlay -->
		<div class="auth-gate" id="auth-gate">
			<div class="auth-spinner"></div>
			<span class="font-sans-caption" style="color: var(--main-colors-foreground-f700);">Đang kiểm tra quyền truy cập admin...</span>
		</div>

		<!-- SIDEBAR PANEL (Rendered dynamically by admin-shell.js) -->
		<aside class="sidebar admin-sidebar" id="sidebar" style="display: none;"></aside>

		<!-- MAIN CONTENT WORKSPACE -->
		<div class="main-wrapper admin-main-wrapper" id="admin-content" style="display: none;">
			<main class="main-content admin-main-content">

				<!-- Top Bar -->
				<header class="admin-top-bar">
					<div class="top-bar-left">
						<button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Mở menu quản lý">
							<svg style="width:20px;height:20px;fill:currentColor" viewBox="0 0 24 24">
								<path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
							</svg>
						</button>
						<div>
							<div class="admin-breadcrumb">
								<a href="../../index.html">Admin</a>
								<span class="separator">/</span>
								<a href="index.html">Cohorts</a>
								<span class="separator">/</span>
								<span>Mở lớp mới</span>
							</div>
							<h4 class="font-sans-h4 medium m-0" style="color: var(--main-colors-foreground-f100);">Mở Lớp Học Mới (Cohort)</h4>
						</div>
					</div>
					<div class="top-bar-actions">
						<a href="index.html" class="btn-admin btn-admin-secondary btn-admin-sm">← Quay lại danh sách</a>
					</div>
				</header>

				<!-- FORM CARD (Full horizontal width) -->
				<div class="admin-card">
					<div class="admin-card-header">
						<h5 class="font-sans-h5 medium m-0" style="color: var(--main-colors-foreground-f200);">Thông Tin Lớp Học Tuyển Sinh</h5>
						<span class="font-sans-small" style="color: var(--main-colors-foreground-f700);">Khai báo đợt tuyển sinh và thiết lập lịch đào tạo</span>
					</div>

					<form id="create-cohort-form">
						<div class="form-grid-2">
							<div class="form-group">
								<label for="cohort-course">Thuộc Khóa Học (Course) <span class="required">*</span></label>
								<select id="cohort-course" class="form-control-custom" required>
									<option value="">-- Chọn Khóa Học --</option>
								</select>
							</div>
							<div class="form-group">
								<label for="cohort-code">Mã Lớp Học <span class="required">*</span></label>
								<input type="text" id="cohort-code" class="form-control-custom" placeholder="VD: DT-C08, UXA-C03..." required style="text-transform: uppercase;">
								<span class="form-hint">Mã định danh lớp học duy nhất (in hoa).</span>
							</div>
						</div>

						<div class="form-grid-2">
							<div class="form-group">
								<label for="cohort-title">Tên Lớp Học <span class="required">*</span></label>
								<input type="text" id="cohort-title" class="form-control-custom" placeholder="VD: Design Thinking Khóa 08 (Tháng 10/2026)" required>
							</div>
							<div class="form-group">
								<label for="cohort-status">Trạng thái Lớp <span class="required">*</span></label>
								<select id="cohort-status" class="form-control-custom" required>
									<option value="open" selected>Đang mở tuyển sinh (Open)</option>
									<option value="in-progress">Đang trong quá trình học (In Progress)</option>
									<option value="completed">Đã kết thúc / Tốt nghiệp (Completed)</option>
								</select>
							</div>
						</div>

						<div class="form-grid-3">
							<div class="form-group">
								<label for="cohort-trainer">Giảng viên Phụ trách</label>
								<input type="text" id="cohort-trainer" class="form-control-custom" placeholder="VD: Thầy Nguyễn Văn A">
							</div>
							<div class="form-group">
								<label for="cohort-capacity">Sĩ số tối đa</label>
								<input type="number" id="cohort-capacity" class="form-control-custom" value="20" min="1">
							</div>
							<div class="form-group">
								<label for="cohort-tuition">Học phí niêm yết (VNĐ)</label>
								<input type="text" id="cohort-tuition" class="form-control-custom" placeholder="VD: 8.500.000">
							</div>
						</div>

						<div class="form-grid-2">
							<div class="form-group">
								<label for="cohort-schedule">Lịch học chi tiết</label>
								<input type="text" id="cohort-schedule" class="form-control-custom" placeholder="VD: Tối 2-4-6 (19:30 - 21:30) Online qua Google Meet">
							</div>
							<div class="form-group">
								<label for="cohort-form-url">Link Form Đăng Ký (Google Form / Tally)</label>
								<input type="url" id="cohort-form-url" class="form-control-custom" placeholder="https://forms.gle/... hoặc link trang đăng ký">
							</div>
						</div>

						<div class="form-group">
							<label for="cohort-notes">Ghi chú tuyển sinh & lưu ý</label>
							<textarea id="cohort-notes" class="form-control-custom" rows="3" placeholder="Ghi chú về địa điểm, link tài liệu hoặc ưu đãi học bổng..."></textarea>
						</div>

						<div class="d-flex justify-content-end gap-3 mt-4 pt-3" style="border-top: 0.5px solid var(--transparent-foreground-main-color-10);">
							<a href="index.html" class="btn-admin btn-admin-secondary">Hủy Bỏ</a>
							<button type="submit" class="btn-admin btn-admin-primary" id="btn-save-cohort">💾 Tạo Lớp Học Mới</button>
						</div>
					</form>
				</div>

			</main>
		</div>

	</div>

	<script src="cohort-create.js"></script>
	<script src="../../admin-shell.js"></script>

</body>

</html>
