<!DOCTYPE html>
<html lang="vi">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Quản lý Khóa học — UXCamp Admin</title>
	<link rel="icon" href="../../../asset/icon/favicon.ico">
	<meta name="robots" content="noindex, nofollow">

	<!-- Bootstrap 5 -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- External scripts -->
	<script src="../../../script/libs/svg-inject.min.js"></script>

	<!-- Custom CSS -->
	<link rel="stylesheet" type="text/css" href="../../../style/definition.css">
	<link rel="stylesheet" type="text/css" href="../../../style/style.css">
	<link rel="stylesheet" type="text/css" href="../../../style/admin.css">
	<link rel="stylesheet" type="text/css" href="../../admin-shared.css">

	<!-- Firebase SDK -->
	<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>

<body>

	<div class="app-container admin-app-container">

		<!-- Auth gate overlay -->
		<div class="auth-gate" id="auth-gate">
			<div class="auth-spinner"></div>
			<span class="font-sans-caption" style="color: var(--main-colors-foreground-f700);">Đang kiểm tra quyền truy cập admin...</span>
		</div>

		<!-- SIDEBAR PANEL (Rendered dynamically by admin-shell.js) -->
		<aside class="sidebar admin-sidebar" id="sidebar" style="display: none;"></aside>

		<!-- MAIN CONTENT WORKSPACE (Fill 100% Horizontal) -->
		<div class="main-wrapper admin-main-wrapper" id="admin-content" style="display: none;">
			<main class="main-content admin-main-content">

				<!-- Top Bar -->
				<header class="admin-top-bar">
					<div class="top-bar-left">
						<button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Mở menu quản lý">
							<svg style="width:20px;height:20px;fill:currentColor" viewBox="0 0 24 24">
								<path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
							</svg>
						</button>
						<div>
							<div class="admin-breadcrumb">
								<a href="../../index.html">Admin</a>
								<span class="separator">/</span>
								<a href="index.html">LMS</a>
								<span class="separator">/</span>
								<span>Courses</span>
							</div>
							<h4 class="font-sans-h4 medium m-0" style="color: var(--main-colors-foreground-f100);">Quản Lý Danh Mục Khóa Học</h4>
						</div>
					</div>
					<div class="top-bar-actions">
						<button type="button" class="btn-admin btn-admin-secondary btn-admin-sm" id="btn-export-courses">Export JSON</button>
						<a href="create.html" class="btn-admin btn-admin-primary btn-admin-sm">+ Thêm Khóa Học Mới</a>
					</div>
				</header>

				<!-- STATS BAR -->
				<div class="admin-stats-bar mb-4">
					<div class="stat-card">
						<span class="stat-value" id="stat-courses-total">0</span>
						<span class="stat-label">Tổng Khóa Học</span>
					</div>
					<div class="stat-card">
						<span class="stat-value" id="stat-courses-active" style="color: var(--highlight-green);">0</span>
						<span class="stat-label">Đang Hoạt Động</span>
					</div>
					<div class="stat-card">
						<span class="stat-value" id="stat-courses-upcoming" style="color: var(--highlight-blue);">0</span>
						<span class="stat-label">Sắp Khai Giảng</span>
					</div>
					<div class="stat-card">
						<span class="stat-value" id="stat-courses-online" style="color: var(--highlight-yellow);">0</span>
						<span class="stat-label">Online / Hybrid</span>
					</div>
				</div>

				<!-- COURSE TABLE CARD -->
				<section class="admin-card">
					<div class="admin-card-header flex-wrap gap-2">
						<div>
							<h5 class="font-sans-h5 medium m-0" style="color: var(--main-colors-foreground-f200);">Danh Sách Khóa Học (Courses)</h5>
							<span class="font-sans-small" style="color: var(--main-colors-foreground-f700);">Chương trình đào tạo thực chiến tại UXCamp</span>
						</div>
						<div class="d-flex gap-2 align-items-center flex-wrap">
							<select id="filter-course-delivery" class="form-control-custom" style="width: auto; height: 36px; padding: 4px 10px; font-size: 12px;">
								<option value="all">Tất cả Hình thức</option>
								<option value="online">Online</option>
								<option value="offline">Offline</option>
								<option value="hybrid">Hybrid</option>
							</select>
							<select id="filter-course-status" class="form-control-custom" style="width: auto; height: 36px; padding: 4px 10px; font-size: 12px;">
								<option value="all">Tất cả Trạng thái</option>
								<option value="active">Active (Đang dạy)</option>
								<option value="upcoming">Upcoming (Sắp ra mắt)</option>
								<option value="archived">Archived (Lưu trữ)</option>
							</select>
							<input type="text" id="search-course" class="form-control-custom" placeholder="Tìm theo mã, tên khóa..." style="width: 220px; height: 36px; font-size: 12px;">
						</div>
					</div>

					<div class="user-table-container" id="courses-list-container">
						<div class="empty-state p-4 text-center">
							<div class="auth-spinner"></div>
							<span class="font-sans-caption mt-2">Đang tải danh sách khóa học...</span>
						</div>
					</div>
				</section>

			</main>
		</div>

	</div>

	<script src="course-index.js"></script>
	<script src="../../admin-shell.js"></script>

</body>

</html>
