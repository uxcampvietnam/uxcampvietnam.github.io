<!DOCTYPE html>
<html lang="vi">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Đăng nhập — UXCamp Vietnam</title>
	<link rel="icon" href="https://uxcamp.vn/asset/icon/favicon.ico">

	<meta name="title" content="Đăng nhập — UXCamp Vietnam">
	<meta name="description"
		content="Đăng nhập vào UXCamp Vietnam để truy cập các công cụ và tài nguyên dành riêng cho thành viên.">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://uxcamp.vn/authentication.html">
	<meta property="og:title" content="Đăng nhập — UXCamp Vietnam">
	<meta property="og:description"
		content="Đăng nhập vào UXCamp Vietnam để truy cập các công cụ và tài nguyên dành riêng cho thành viên.">
	<meta property="og:image" content="https://i.ibb.co/7x4FWwHJ/uxcampvietnam.jpg">

	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

	<!-- External scripts -->
	<script src="script/libs/svg-inject.min.js"></script>
	<script src="script/main-header.js" defer></script>

	<!-- Custom CSS -->
	<link rel="stylesheet" type="text/css" href="style/definition.css">
	<link rel="stylesheet" type="text/css" href="style/style.css">
	<link rel="stylesheet" type="text/css" href="style/tool-auth.css">

	<!-- Firebase SDK (compat) -->
	<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>

<body>

	<header class="site-main-header" id="siteMainHeader"></header>

	<div class="auth-page">

		<!-- Auth Card -->
		<div class="auth-card">

			<!-- Header -->
			<header class="auth-header">
				<a href="index.html" aria-label="Về trang chủ">
					<img class="eye-logo" src="asset/icon/eye.svg" alt="UXCamp Vietnam" onload="SVGInject(this)">
				</a>
				<div class="h6 text-logo">UXCAMP VIETNAM</div>
			</header>

			<!-- Panel -->
			<div class="auth-panel">

				<!-- Loading spinner -->
				<div class="auth-spinner-container" id="auth-spinner-container">
					<div class="auth-spinner" id="auth-spinner"></div>
				</div>

				<!-- Login section (shown when not logged in) -->
				<div id="login-section">
					<button class="google-signin-btn paragraph" id="btn-google-signin" type="button"
						aria-label="Đăng nhập bằng Google">
						<!-- Google "G" logo SVG -->
						<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
							<path
								d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
								fill="#4285F4" />
							<path
								d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
								fill="#34A853" />
							<path
								d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 0 0 1 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84z"
								fill="#FBBC05" />
							<path
								d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
								fill="#EA4335" />
						</svg>
						<span>Đăng nhập bằng Google</span>
					</button>
				</div>



				<!-- User profile (shown after login) -->
				<div class="user-profile" id="user-profile">
					<img class="user-avatar" id="user-avatar" src="" alt="Avatar">
					<div class="user-info">
						<span class="h5 medium user-name" id="user-name"></span>
						<span class="caption user-email" id="user-email"></span>
						<span class="user-role-badge" id="user-role-badge"></span>
					</div>

					<!-- Status messages -->
					<div class="auth-status" id="auth-status">
						<span class="caption" id="auth-status-text"></span>
					</div>

					<div class="auth-actions">
						<a class="cta-large paragraph" id="btn-go-home" href="index.html">
							Về trang chủ
						</a>
						<button class="secondary-button-large paragraph" id="btn-signout" type="button">
							Đăng xuất
						</button>
					</div>
				</div>

			</div>
		</div>



	</div>

	<!-- Authentication Script -->
	<script src="script/authentication.js"></script>

</body>

</html>
