<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab&Task - Thank You</title>
    <meta name="description" content="Thank you for trying Tab&Task. Reinstall anytime from the Chrome Web Store.">

    <link rel="icon" href="/asset/icon/tab-task-favicon.svg">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Work+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="/script/libs/svg-inject.min.js"></script>

    <link rel="stylesheet" type="text/css" href="/style/definition.css">
    <link rel="stylesheet" type="text/css" href="/style/style.css">

    <link rel="stylesheet" href="/tabandtask/style.css">
</head>

<body>

    <!-- Navbar (dùng chung với index.html) -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a href="/tabandtask/index.html">
                <img class="fs-3 tab-task-logo" src="/asset/icon/tab-and-task.svg" alt="Tab&Task Logo"
                    style="height: 40px; width: auto;" onload="SVGInject(this)">
            </a>
            <div class="ms-auto d-flex align-items-center gap-3">
                <a href="/tabandtask/termcondition.html" class="small opacity-75 d-none d-sm-inline">Terms &
                    Conditions</a>
                <a style="color: var(--main-colors-background-b100) !important"
                    href="https://chromewebstore.google.com/detail/tabtask/ldeceampkbbeigojeglgajnceomfohlf"
                    target="_blank" rel="noopener noreferrer" class="btn-primary d-none d-md-block">Add to Chrome</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section (Cảm ơn & Reinstall App) -->
    <header class="hero-section" style="min-height: calc(100vh - 75px); display: flex; align-items: center;">
        <div class="container h-100">
            <div class="row h-100 align-items-center">
                <div class="col-lg-6">
                    <h1 class="display-3 medium mb-4 xl-title">
                        Thank you for<br>trying Tab&amp;Task.
                    </h1>
                    <p class="lead mb-5 opacity-75">
                        We're sorry to see you go. If you uninstalled by accident or ever want to experience the latest
                        updates, you can reinstall Tab&amp;Task anytime from the Chrome Web Store.
                    </p>
                    <div class="d-flex gap-3">
                        <a href="https://chromewebstore.google.com/detail/tabtask/ldeceampkbbeigojeglgajnceomfohlf"
                            target="_blank" rel="noopener noreferrer">
                            <img src="/asset/icon/Available Chrome Web Store.svg" onload="SVGInject(this)"
                                alt="Available in the Chrome Web Store">
                        </a>
                    </div>
                </div>
                <div class="hero-image img-fluid col-lg-6 mt-5 mt-lg-0">
                </div>
            </div>
        </div>
    </header>

    <!-- Footer -->
    <footer class="py-4 border-top" style="border-color: var(--border-color) !important;">
        <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
            <span class="opacity-75 small">© Tab&amp;Task. All rights reserved.</span>
            <div class="d-flex gap-3 align-items-center">
                <a href="/tabandtask/termcondition.html" class="small opacity-75 text-decoration-underline">Terms &amp;
                    Conditions</a>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
