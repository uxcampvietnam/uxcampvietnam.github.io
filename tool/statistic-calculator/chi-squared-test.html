<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi-squared Test</title>
  <meta property="og:image" content="https://i.ibb.co/93HLFLP4/04.png" />
  <meta property="og:description" content='UXCamp Vietnam' />
  <meta property="og:url" content='http://uxcamp.vn/' />

  <link rel="stylesheet" type="text/css" href="../../style/definition.css">
  <link rel="stylesheet" href="../checklist/style/styles.css">
  <link rel="stylesheet" href="calculator.css">
  <link rel="stylesheet" href="../../style/tool-auth.css">

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../../script/auth-guard.js"></script>

  <script src="../../script/main-header.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jstat/1.9.4/jstat.min.js"></script>
  <script src="script.js"></script>
  <script src="../../script/libs/svg-inject.min.js"></script>

  <script>
    window.onload = createTable;
  </script>
</head>

<body>

  <header class="site-main-header" id="siteMainHeader" data-active="Tool"></header>

  <div class="app-container">

    <!-- --- SIDEBAR PANEL --- -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- --- MAIN CONTENT WORKSPACE --- -->
    <div class="main-wrapper">
      <main class="main-content">

        <!-- Top Mobile Navigation/Toggle Bar -->
        <header class="main-header" style="flex-wrap: wrap; gap: 16px;">
          <div style="flex: 1; min-width: 250px;">
            <h2>Chi-squared Test</h2>
            <p>Kiểm định dùng để so sánh tần suất quan sát được với tần suất kỳ vọng.</p>
          </div>

          <!-- Toggle button on tablet/mobile -->
          <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Mở menu quản lý dự án">
            <svg style="width:24px;height:24px;fill:currentColor" viewBox="0 0 24 24">
              <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
            </svg>
          </button>
        </header>

        <!-- Calculator Layout Grid -->
        <div class="calculator-grid">

          <!-- Inputs -->
          <div class="calculator-card">
            <h3>Tham số</h3>

            <div class="table-size-input-container caption" style="margin-bottom: 16px;">
              <span>
                <label for="rows">Số hàng:</label>
                <input style="width: 80px;" type="number" id="rows" value="2" min="2">
              </span>
              <span>
                <label for="cols">Số cột:</label>
                <input style="width: 80px;" type="number" id="cols" value="2" min="2">
              </span>
              <button onclick="createTable()" class="stat-btn-secondary" style="min-height: 40px; padding: 8px 16px;">Tạo bảng</button>
            </div>

            <div id="tableContainer">
              <table id="dataTable" onpaste="pasteDataToTable()">
              </table>
            </div>

            <div class="input-row-container stat-radio-group" id="alpha">
              <label class="input-row-title">Mức ý nghĩa - α:</label>
              <span class="stat-radio">
                <input type="radio" id="alpha010" name="alpha-selection" value="0.10">
                <label for="alpha010">0.10</label>
              </span>
              <span class="stat-radio">
                <input type="radio" id="alpha005" name="alpha-selection" value="0.05" checked>
                <label for="alpha005">0.05</label>
              </span>
              <span class="stat-radio">
                <input type="radio" id="alpha001" name="alpha-selection" value="0.01">
                <label for="alpha001">0.01</label>
              </span>
            </div>

            <button class="stat-btn-primary" onclick="calculateChiSquared()">Perform Chi-squared Test</button>
          </div>

          <!-- Result Card -->
          <div id="result"></div>

        </div>

      </main>
    </div>

  </div>

</body>

</html>
