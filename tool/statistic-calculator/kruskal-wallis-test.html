<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kruskal-Wallis Test</title>
  <meta property="og:image" content="https://i.ibb.co/nND0fhRt/03.png" />
  <meta property="og:description" content='UXCamp Vietnam' />
  <meta property="og:url" content='http://uxcamp.vn/' />

  <link rel="stylesheet" type="text/css" href="../../style/definition.css">
  <link rel="stylesheet" href="../checklist/style/styles.css">
  <link rel="stylesheet" href="calculator.css">
  <link rel="stylesheet" href="../../style/tool-auth.css">

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../../script/auth-guard.js"></script>

  <script src="../../script/main-header.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jstat@1.9.6/dist/jstat.min.js"></script>
  <script src="script.js"></script>
  <script src="../../script/libs/svg-inject.min.js"></script>
</head>

<body>

  <header class="site-main-header" id="siteMainHeader" data-active="Tool"></header>

  <div class="app-container">

    <!-- --- SIDEBAR PANEL --- -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- --- MAIN CONTENT WORKSPACE --- -->
    <div class="main-wrapper">
      <main class="main-content">

        <!-- Top Mobile Navigation/Toggle Bar -->
        <header class="main-header" style="flex-wrap: wrap; gap: 16px;">
          <div style="flex: 1; min-width: 250px;">
            <h2>Kruskal-Wallis Test</h2>
            <p>Kiểm định phi tham số để so sánh trung vị giữa nhiều hơn hai nhóm độc lập.</p>
          </div>

          <!-- Toggle button on tablet/mobile -->
          <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Mở menu quản lý dự án">
            <svg style="width:24px;height:24px;fill:currentColor" viewBox="0 0 24 24">
              <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
            </svg>
          </button>
        </header>

        <!-- Calculator Layout Grid -->
        <div class="calculator-grid">

          <!-- Inputs -->
          <div class="calculator-card">
            <h3>Tham số</h3>

            <div id="groups" style="display: flex; flex-direction: column; gap: 16px;">
              <div class="kruskal-wallis-group-block">
                <input type="text" placeholder="Tên nhóm" value="Nhóm 1" class="group-label"
                  style="margin-bottom: 8px;" />
                <textarea placeholder="Enter data (e.g. 32, 66, 57, 27...)"></textarea>
              </div>
              <div class="kruskal-wallis-group-block">
                <input type="text" placeholder="Tên nhóm" value="Nhóm 2" class="group-label"
                  style="margin-bottom: 8px;" />
                <textarea placeholder="Enter data (e.g. 32, 66, 57, 27...)"></textarea>
              </div>
              <div class="kruskal-wallis-group-block">
                <input type="text" placeholder="Tên nhóm" value="Nhóm 3" class="group-label"
                  style="margin-bottom: 8px;" />
                <textarea placeholder="Enter data (e.g. 32, 66, 57, 27...)"></textarea>
              </div>
            </div>

            <div class="kruskal-wallis-add-remove-group">
              <button class="stat-btn-secondary" onclick="addKruskalWallisGroup()">+ Thêm nhóm</button>
              <button class="stat-btn-secondary" onclick="removeKruskalWallisGroup()" style="color: var(--highlight-red) !important; border-color: var(--highlight-red) !important;">- Xóa nhóm cuối</button>
            </div>

            <div class="input-row-container stat-radio-group" id="alpha">
              <label class="input-row-title">Mức ý nghĩa - α:</label>
              <span class="stat-radio">
                <input type="radio" id="alpha010" name="alpha-selection" value="0.10">
                <label for="alpha010">0.10</label>
              </span>
              <span class="stat-radio">
                <input type="radio" id="alpha005" name="alpha-selection" value="0.05" checked>
                <label for="alpha005">0.05</label>
              </span>
              <span class="stat-radio">
                <input type="radio" id="alpha001" name="alpha-selection" value="0.01">
                <label for="alpha001">0.01</label>
              </span>
            </div>

            <button class="stat-btn-primary" onclick="calculateKruskalWallis()">Perform Kruskal-Wallis Test</button>
          </div>

          <!-- Result Card -->
          <div id="result"></div>

        </div>

      </main>
    </div>

  </div>

</body>

</html>
