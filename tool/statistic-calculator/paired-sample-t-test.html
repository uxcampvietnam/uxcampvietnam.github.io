<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paired Sample t-Test</title>
  <meta property="og:image" content="https://i.ibb.co/1pzZtrF/05.png" />
  <meta property="og:description" content='UXCamp Vietnam' />
  <meta property="og:url" content='http://uxcamp.vn/' />

  <script src="https://cdn.jsdelivr.net/npm/jstat@1.9.6/dist/jstat.min.js"></script>
  <script src="script.js"></script>
  <script src="../../script/libs/svg-inject.min.js"></script>

  <link rel="stylesheet" type="text/css" href="../../style/definition.css">
  <link rel="stylesheet" href="../checklist/style/styles.css">
  <link rel="stylesheet" href="calculator.css">
</head>

<body>

  <div class="app-container">

    <!-- --- SIDEBAR PANEL --- -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- --- MAIN CONTENT WORKSPACE --- -->
    <div class="main-wrapper">
      <main class="main-content">

        <!-- Top Mobile Navigation/Toggle Bar -->
        <header class="main-header" style="flex-wrap: wrap; gap: 16px;">
          <div style="flex: 1; min-width: 250px;">
            <h2>Paired Sample t-Test</h2>
            <p>So sánh trung bình của hai nhóm dữ liệu có liên hệ (đôi/phụ thuộc).</p>
          </div>

          <!-- Toggle button on tablet/mobile -->
          <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Mở menu quản lý dự án">
            <svg style="width:24px;height:24px;fill:currentColor" viewBox="0 0 24 24">
              <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
            </svg>
          </button>
        </header>

        <!-- Calculator Layout Grid -->
        <div class="calculator-grid">

          <!-- Inputs -->
          <div class="calculator-card">
            <h3>Tham số</h3>

            <div class="section">
              <label for="group1">Biến số 1 (Ví dụ: Trước tác động):</label>
              <input type="text" id="group1Name" placeholder="Before" value="Before">
              <textarea id="group1" placeholder="Enter data (e.g. 32, 66, 57, 27...)"></textarea>
            </div>

            <div class="section">
              <label for="group2">Biến số 2 (Ví dụ: Sau tác động):</label>
              <input type="text" id="group2Name" placeholder="After" value="After">
              <textarea id="group2" placeholder="Enter data (e.g. 32, 66, 57, 27...)"></textarea>
            </div>

            <div class="input-row-container" id="alpha">
              <label class="input-row-title font-sans-caption">Mức ý nghĩa - α:</label>
              <span class="font-sans-caption">
                <input type="radio" id="alpha010" name="alpha-selection" value="0.10">
                <label class="font-sans-caption" for="alpha010">0.10</label>
              </span>
              <span class="font-sans-caption">
                <input type="radio" id="alpha005" name="alpha-selection" value="0.05" checked>
                <label class="font-sans-caption" for="alpha005">0.05</label>
              </span>
              <span class="font-sans-caption">
                <input type="radio" id="alpha001" name="alpha-selection" value="0.01">
                <label class="font-sans-caption" for="alpha001">0.01</label>
              </span>
            </div>

            <div class="input-row-container" id="testType">
              <label class="input-row-title font-sans-caption">Loại kiểm định:</label>
              <span class="font-sans-caption">
                <input type="radio" id="two-tailed" name="testType-selection" value="two-tailed" checked>
                <label class="font-sans-caption" for="two-tailed">Hai phía: ≠</label>
              </span>
              <span class="font-sans-caption">
                <input type="radio" id="greater" name="testType-selection" value="greater">
                <label class="font-sans-caption" for="greater">Một phía: ></label>
              </span>
              <span class="font-sans-caption">
                <input type="radio" id="less" name="testType-selection" value="less">
                <label class="font-sans-caption" for="less">Một phía: < </label>
              </span>
            </div>

            <button class="cta-large paragraph medium font-sans-caption" onclick="calculatePairedTTest()">Perform Paired
              Sample t-Test</button>
          </div>

          <!-- Result Card -->
          <div id="result"></div>

        </div>

      </main>
    </div>

  </div>

</body>

</html>
