<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Size Calculator</title>
  <meta property="og:image" content="https://i.ibb.co/Xf4f4HXx/06.png" />
  <meta property="og:description" content='UXCamp Vietnam' />
  <meta property="og:url" content='http://uxcamp.vn/' />

  <link rel="stylesheet" type="text/css" href="../../style/definition.css">
  <link rel="stylesheet" href="../checklist/style/styles.css">
  <link rel="stylesheet" href="calculator.css">
  <link rel="stylesheet" href="../../style/tool-auth.css">

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../../script/auth-guard.js"></script>

  <script src="../../script/main-header.js" defer></script>
  <script src="script.js"></script>
  <script src="../../script/libs/svg-inject.min.js"></script>
</head>

<body>

  <header class="site-main-header" id="siteMainHeader" data-active="Tool"></header>

  <div class="app-container">

    <!-- --- SIDEBAR PANEL --- -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- --- MAIN CONTENT WORKSPACE --- -->
    <div class="main-wrapper">
      <main class="main-content">

        <!-- Top Mobile Navigation/Toggle Bar -->
        <header class="main-header" style="flex-wrap: wrap; gap: 16px;">
          <div style="flex: 1; min-width: 250px;">
            <h2>Sample Size Calculator</h2>
            <p>Ước lượng số lượng mẫu cần thiết để đảm bảo kết quả có ý nghĩa thống kê.</p>
          </div>

          <!-- Toggle button on tablet/mobile -->
          <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Mở menu quản lý dự án">
            <svg style="width:24px;height:24px;fill:currentColor" viewBox="0 0 24 24">
              <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
            </svg>
          </button>
        </header>

        <!-- Calculator Layout Grid -->
        <div class="calculator-grid">

          <!-- Inputs -->
          <div class="calculator-card">
            <h3>Tham số</h3>

            <div class="input-row-container">
              <label class="input-row-title font-sans-caption" for="population">Population Size:</label>
              <input type="number" id="population" placeholder="e.g., 10000" value="10000">
            </div>

            <div class="input-row-container">
              <label class="input-row-title font-sans-caption" for="margin">Margin of Error (%):</label>
              <input type="number" id="margin" placeholder="e.g., 5" value="5">
            </div>

            <div class="input-row-container stat-radio-group" id="confidence">
              <label class="input-row-title">Confidence Level:</label>
              <span class="stat-radio">
                <input type="radio" id="confident-level-80" name="confidence-level-selection" value="1.28155157">
                <label for="confident-level-80">80%</label>
              </span>
              <span class="stat-radio">
                <input type="radio" id="confident-level-85" name="confidence-level-selection" value="1.43953147">
                <label for="confident-level-85">85%</label>
              </span>
              <span class="stat-radio">
                <input type="radio" id="confident-level-90" name="confidence-level-selection" value="1.64485363">
                <label for="confident-level-90">90%</label>
              </span>
              <span class="stat-radio">
                <input type="radio" id="confident-level-95" name="confidence-level-selection" value="1.95996398"
                  checked>
                <label for="confident-level-95">95%</label>
              </span>
              <span class="stat-radio">
                <input type="radio" id="confident-level-99" name="confidence-level-selection" value="2.57582930">
                <label for="confident-level-99">99%</label>
              </span>
            </div>

            <button class="stat-btn-primary" onclick="calculateSampleSize()">Calculate Sample Size</button>
          </div>

          <!-- Result Card -->
          <div id="result"></div>

        </div>

      </main>
    </div>

  </div>

</body>

</html>
